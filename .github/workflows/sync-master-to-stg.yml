name: Sync master to stg

on:
  schedule:
    # 毎週木曜 9:00 JST (UTC 0:00)
    - cron: '0 0 * * 4'
  workflow_dispatch:
    inputs:
      head:
        description: 'マージ元ブランチ'
        required: true
        default: 'master'
      base:
        description: 'マージ先ブランチ'
        required: true
        default: 'stg'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/merge-or-create-pr
        with:
          head: ${{ inputs.head || 'master' }}
          base: ${{ inputs.base || 'stg' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}