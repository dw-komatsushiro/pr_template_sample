name: 'Merge or create conflict-resolution PR'
description: >
  head ブランチを base ブランチへマージする。コンフリクトなく完了できた場合は
  base に直接プッシュし、コンフリクトした場合は base から新規ブランチを切って
  マージ結果（コンフリクトマーカー含む）をコミットし、base 宛のPRを作成する。
inputs:
  head:
    description: 'マージ元ブランチ名（例: master）'
    required: true
  base:
    description: 'マージ先ブランチ名（例: stg）'
    required: true
  github-token:
    description: 'PR作成・push に使うトークン'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Fetch branches
      shell: bash
      run: |
        git fetch origin "${{ inputs.head }}" "${{ inputs.base }}"

    - name: Try merge
      id: try_merge
      shell: bash
      run: |
        set -e
        HEAD="${{ inputs.head }}"
        BASE="${{ inputs.base }}"

        git checkout -B "${BASE}" "origin/${BASE}"

        if git merge --no-commit --no-ff "origin/${HEAD}"; then
          git commit -m "Merge ${HEAD} into ${BASE}"
          echo "conflicted=false" >> "$GITHUB_OUTPUT"
        else
          git merge --abort || true
          echo "conflicted=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Push merged base branch
      if: steps.try_merge.outputs.conflicted == 'false'
      shell: bash
      run: |
        git push origin "HEAD:${{ inputs.base }}"

    - name: Create conflict branch and PR
      if: steps.try_merge.outputs.conflicted == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        HEAD="${{ inputs.head }}"
        BASE="${{ inputs.base }}"
        SYNC_BRANCH="sync/${HEAD}-to-${BASE}"

        # 既に同じ組み合わせでオープン中のPRがあれば重複作成しない
        EXISTING=$(gh pr list --base "${BASE}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')
        if [ -n "${EXISTING}" ]; then
          echo "PR #${EXISTING} already open for ${SYNC_BRANCH} -> ${BASE}. Skipping."
          exit 0
        fi

        git checkout -B "${SYNC_BRANCH}" "origin/${BASE}"
        git merge --no-ff "origin/${HEAD}" || true
        git add -A
        git commit -m "Merge ${HEAD} into ${BASE} (conflicts to resolve)"
        git push --force origin "${SYNC_BRANCH}"

        gh pr create \
          --base "${BASE}" \
          --head "${SYNC_BRANCH}" \
          --title "[Conflict] Merge ${HEAD} into ${BASE}" \
          --body "${HEAD} から ${BASE} への自動マージがコンフリクトしたため作成されました。コンフリクトを解消してマージしてください。"